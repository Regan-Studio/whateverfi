name: whateverfi-site-ci

# Root copy of whateverfi-site/.github/workflows/ci.yml (GitHub only reads workflows from the repo root).
# Builds the pinned upstream with the WhatEverFi overlay and verifies branding. Runs only when the
# whateverfi-site/ wrapper (or this file) changes, so the rest of this repo is unaffected.
on:
  pull_request:
    paths:
      - "whateverfi-site/**"
      - ".github/workflows/whateverfi-site-*.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: whateverfi-site-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: whateverfi-site

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # raises the GitHub API limit for star/commit lookups at build time
    steps:
      - uses: actions/checkout@v4
      - uses: ./whateverfi-site/.github/actions/setup
        with:
          dir: whateverfi-site
      - name: Lint wrapper scripts
        run: |
          bash -n scripts/*.sh
          node --check scripts/apply-overlay.mjs
          node --check scripts/verify-build.mjs
          node --check scripts/postbuild.mjs
          python3 -m py_compile scripts/rebrand-assets.py
      - name: Fetch pinned upstream, apply overlay, build, astro check, verify branding (incl. OCR)
        run: scripts/sync-upstream.sh --ocr
      - uses: actions/upload-artifact@v4
        with:
          name: whateverfi-site-${{ github.sha }}
          path: whateverfi-site/dist/
          retention-days: 14
      - name: Preview deploy (only when Cloudflare is configured)
        id: preview
        if: github.event_name == 'pull_request' && vars.DEPLOY_TARGET == 'cloudflare-pages' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
        run: scripts/deploy.sh preview "pr-${{ github.event.pull_request.number }}"
      - name: Comment preview URL
        if: steps.preview.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body "WhatEverFi preview deploy: $PREVIEW_URL"
