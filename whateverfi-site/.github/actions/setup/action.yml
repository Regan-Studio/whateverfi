name: setup
description: Node (version pinned in upstream.json), corepack pnpm, tesseract for OCR branding checks
inputs:
  dir:
    description: Directory of the wrapper repo relative to the checkout root
    required: false
    default: "."
runs:
  using: composite
  steps:
    - id: versions
      shell: bash
      run: echo "node=$(jq -r .node "${{ inputs.dir }}/upstream.json")" >> "$GITHUB_OUTPUT"
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ steps.versions.outputs.node }}
    - shell: bash
      run: |
        corepack enable
        sudo apt-get update -qq
        sudo apt-get install -y -qq tesseract-ocr python3-pil fonts-liberation > /dev/null
    - uses: actions/cache@v4
      with:
        path: |
          ~/.local/share/pnpm/store
          ${{ inputs.dir }}/.cache/upstream/node_modules
        key: pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/upstream.json', inputs.dir)) }}
        restore-keys: pnpm-${{ runner.os }}-
