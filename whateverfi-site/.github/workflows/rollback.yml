name: rollback

# Redeploys an earlier wrapper revision (a deploy-* tag or any commit SHA). Because upstream.json
# pins the upstream SHA, rebuilding an old wrapper revision reproduces that release's content.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "deploy-* tag or wrapper commit SHA to redeploy (list: git tag -l 'deploy-*')"
        required: true

permissions:
  contents: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DEPLOY_TARGET: ${{ vars.DEPLOY_TARGET || 'none' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Show what is being redeployed
        run: |
          echo "Wrapper: $(git rev-parse HEAD)  upstream: $(jq -r .sha upstream.json)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: ./.github/actions/setup
      - name: Rebuild that revision
        run: scripts/sync-upstream.sh --ocr
      - name: Deploy
        id: deploy
        run: scripts/deploy.sh production
      - name: Tag rollback
        if: env.DEPLOY_TARGET != 'none'
        run: |
          tag="rollback-$(date -u +%Y%m%d-%H%M%S)-$(git rev-parse --short=7 HEAD)"
          git tag "$tag" HEAD && git push origin "refs/tags/$tag"
          echo "Rolled back to ${{ inputs.ref }} as $tag ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
