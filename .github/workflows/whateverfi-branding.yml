name: whateverfi-branding

# Local draft, not pushed. Runs branding-guard and gitleaks on pull requests
# and manual dispatch. Never deploys, never merges, never publishes images.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Branding guard
        run: bash overlays/whateverfi/scripts/branding-guard.sh .
      - name: Gitleaks
        run: |
          set -euo pipefail
          ver=8.30.1
          curl -fsSL -o /tmp/gitleaks_checksums.txt "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_checksums.txt"
          curl -fsSL -o /tmp/gitleaks_linux_x64.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${ver}/gitleaks_${ver}_linux_x64.tar.gz"
          awk "/gitleaks_${ver}_linux_x64.tar.gz\$/" /tmp/gitleaks_checksums.txt | (cd /tmp && sha256sum -c -)
          tar -xzf /tmp/gitleaks_linux_x64.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --exit-code 1
